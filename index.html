<!doctype html>
<!-- Startsprache ist Deutsch. Beim Umschalten auf Englisch setzt
     LanguageContext dieses Attribut auf "en". -->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Diese Seite ist fuer Hell gemacht. Verhindert, dass der
         automatische Dunkelmodus des Browsers die Farben umfaerbt. -->
    <meta name="color-scheme" content="light" />
    <!-- Hier stand frueher der Verweis auf Google Fonts. Die beiden
         Schriften liegen jetzt als Datei im Projekt und werden in
         index.css eingebunden. Dadurch laedt die Seite schneller und
         es gehen keine Besucherdaten an Google. -->
    <!-- Steht im Browser-Tab, in Lesezeichen und in Suchergebnissen -->
    <title>Michael Bergamin — Informatik-Portfolio</title>
    <meta
      name="description"
      content="Persönliche Website von Michael Bergamin, Informatikmittelschule BWD Bern. Projekte, Lebenslauf und Kontakt."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
