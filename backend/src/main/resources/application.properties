# ---- Datenbank ----------------------------------------------------
# Die Werte in ${...} kommen von aussen, der Teil nach dem Doppelpunkt
# ist der Rueckfallwert fuers Entwickeln auf dem eigenen Rechner.
#
# Auf dem Server setzt docker-compose.yml sie:
#   localhost -> db  (so heisst der Datenbank-Container im Docker-Netz)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:portfolio}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:portfolio}

# Hibernate legt die Tabellen aus den @Entity-Klassen selbst an
# und passt sie an, wenn du ein Feld ergaenzt.
# Praktisch beim Entwickeln. Auf dem Server nimmt man "validate"
# und schreibt Aenderungen als Migration (z.B. mit Flyway).
spring.jpa.hibernate.ddl-auto=update

# Zeigt die SQL-Befehle in der Konsole - gut um zu sehen was passiert.
# Auf dem Server aus, sonst laufen die Protokolle voll.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----------------------------------------------------------
# Mit diesem Geheimnis werden die Token unterschrieben.
# ACHTUNG: Auf dem Server MUSS JWT_SECRET als Umgebungsvariable gesetzt
# sein. Wer das Geheimnis kennt, kann sich selbst gueltige Token bauen.
app.jwt.secret=${JWT_SECRET:nur-fuer-lokal-bitte-auf-dem-server-ersetzen-mindestens-32-zeichen}
app.jwt.validity-hours=8

# ---- Erstes Konto -------------------------------------------------
# Wird beim ersten Start angelegt, falls es noch keins gibt.
app.admin.username=${ADMIN_USERNAME:michael}
app.admin.password=${ADMIN_PASSWORD:admin}

# ---- Datei-Upload -------------------------------------------------
# Standardmaessig laesst Spring nur 1 MB zu - ein Foto vom Zeugnis
# ist schnell groesser.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Sonstiges ----------------------------------------------------
server.port=8080
# Woher das Frontend kommen darf. Lokal der Vite-Entwicklungsserver,
# auf dem Server die echte Adresse (https://bergamin.ch).
# Mehrere durch Komma trennen.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- Kontaktangaben ------------------------------------------------
# Wohnort und Telefonnummer stehen bewusst NICHT im Quelltext: das
# Repository ist oeffentlich. Sie kommen aus der Umgebung und werden
# nur an Angemeldete ausgeliefert.
#
# Leer gelassen heisst: die Seite zeigt an der Stelle nichts. Das ist
# der richtige Rueckfallwert - lieber eine fehlende Angabe als eine
# erfundene.
app.contact.place=${CONTACT_PLACE:}
app.contact.phone=${CONTACT_PHONE:}

# ---- Lebenslauf ----------------------------------------------------
# Pfad zur JSON-Datei mit den Lebenslauf-Angaben. Steht nicht im
# Quelltext, weil das Repository oeffentlich ist. Ohne diesen Wert
# zeigt die Lebenslauf-Seite nur das PDF.
app.cv.file=${CV_FILE:}
