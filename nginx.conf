# Wie nginx die Website ausliefert.
#
# Das Gegenstueck zur .htaccess in public/ - die gilt fuer Apache beim
# Webhoster, diese Datei fuer nginx im Container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Der wichtigste Teil.
    #
    # Ruft jemand bergamin.ch/projects auf, sucht nginx einen Ordner
    # "projects" - den gibt es nicht, also 404. Die Adressen erfindet
    # ja erst React im Browser.
    #
    # try_files sagt: schau nach einer Datei mit dem Namen, dann nach
    # einem Ordner, und wenn es beides nicht gibt, liefere index.html.
    # Von dort uebernimmt React und zeigt die richtige Seite.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bilder, Schriften und die gebauten JS- und CSS-Dateien tragen
    # einen Namen mit Pruefsumme (index-B8I.js). Aendert sich der
    # Inhalt, aendert sich der Name - der Browser darf sie also lange
    # behalten.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html dagegen NIE zwischenspeichern. Sie verweist auf die
    # Dateinamen oben. Haelt der Browser eine alte Fassung fest, laedt
    # er nach einem Update ewig die alten Dateien.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Antworten unterwegs zusammenpressen. Spart bei der Seite rund
    # zwei Drittel der uebertragenen Daten.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
